name: Build Jogar Khata APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare App Files
      run: |
        echo "Preparing Jogar Khata files..."
        mkdir -p output_files
        cp index.html output_files/
        if [ -f "icon.png" ]; then
          cp icon.png output_files/
        fi

    - name: Upload Clean Web Package
      uses: actions/upload-artifact@v4
      with:
        name: Jogar-Khata-Web-Package
        path: output_files/

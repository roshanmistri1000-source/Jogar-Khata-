name: Build Jogar Khata APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova and Android Dependencies
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "build-tools;33.0.2" "platforms;android-33"
        npm install -g cordova@12.0.0

    - name: Create Cordova App & Build APK
      run: |
        cordova create app com.akashmistri.jogarkhata "Jogar Khata"
        cd app
        rm -rf www/*
        cp ../index.html www/
        
        if [ -f "../icon.png" ]; then
          cp ../icon.png ./icon.png
          sed -i 's|</widget>|    <icon src="icon.png" />\n</widget>|g' config.xml
        fi

        sed -i 's|</widget>|    <preference name="android-minSdkVersion" value="22" />\n    <preference name="android-targetSdkVersion" value="33" />\n</widget>|g' config.xml

        cordova platform add android@12.0.1
        cordova build android --debug

    - name: Upload Clean APK
      uses: actions/upload-artifact@v4
      with:
        name: Jogar-Khata-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
